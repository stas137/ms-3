syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

// Заменить на актуальный go_package
option go_package = "github.com/stas137/ms-3/shared/pkg/proto/inventory/v1;inventoryv1";

// InventoryService управляет каталогом деталей для космических кораблей
service InventoryService {
  // GetPart возвращает деталь по UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // Добавить метод ListParts
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Тип детали
enum PartType {
  PART_TYPE_UNSPECIFIED = 0;
  PART_TYPE_HULL = 1; // Корпус корабля
  PART_TYPE_ENGINE = 2; // Двигатель
  PART_TYPE_SHIELD = 3; // Защитный щит
  PART_TYPE_WEAPON = 4; // Вооружение
}

// Part представляет деталь космического корабля
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;

  // Название детали
  string name = 2;

  // Описание детали
  string description = 3;

  // Цена в копейках (5000₽ = 500000)
  int64 price = 4;

  // Тип детали (enum)
  PartType part_type = 5;

  // Количество на складе
  int64 stock_quantity = 6;

  // Дата создания
  google.protobuf.Timestamp created_at = 7;
}

// Запрос на получение детали по UUID
message GetPartRequest {
  // Уникальный идентификатор детали
  string uuid = 1;
}

// Реализовать GetPartResponse
message GetPartResponse {
  Part part = 1;
}

// Реализовать ListPartsRequest
message ListPartsRequest {
  // Фильтр по типу (UNSPECIFIED = все детали)
  PartType part_type = 1;

  // Опционально: конкретные UUID (приоритет над part_types)
  repeated string uuids = 2;
}

// Реализовать ListPartsResponse
message ListPartsResponse {
  // Список найденных деталей
  repeated Part parts = 1;
}
