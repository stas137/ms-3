name: "Test API"

on: 
    workflow_call:
    
jobs:
    build:
        name: "API/e2e tests"
        runs-on: ubuntu-24.04                           # runner
        steps:
            - uses: actions/checkout@v6.0.2             # clone repository on runner

            - uses: actions/setup-go@v6.4.0             # install Go
              with:
                go-version: '1.26.0'                    # version
                cache-dependency-path: '**/go.sum'      # cache modules for all go.sum in repository

            - name: Cache task-installed binaries
              uses: actions/cache@v5.0.5
              with:
                path: bin
                key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}    # key os + hash Taskfile.yaml
                restore-keys: |
                    ${{ runner.os }}-task-bin-          # prefix key for restore
            
            - name: Install Task                        # install Task
              run: go install github.com/go-task/task/v3/cmd/task@v3.50.0           # version
            
            - name: Run API tests
              run: task test:api